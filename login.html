<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Currency Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-image: url('https://static.vecteezy.com/system/resources/thumbnails/053/312/124/small_2x/3d-relief-world-map-topography-oceans-continents-earth-photo.jpeg '); /* currency-themed image */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .bg-overlay {
      background-color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body class=" min-h-screen flex items-center justify-center">
  <form action="index.html" method="GET">
    <form onsubmit="handleLogin(event)">
 <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">LOGIN</h2>
    <form action="index.html" method="POST">
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" required
               class="mt-1 p-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-300" />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required
               class="mt-1 p-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-300" />
      </div>
      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-md transition duration-300">
        Log In
        <a href="index.html" class="text-blue-600 hover:underline"></a>
      </button>
      
    </form>
    
    <p class="mt-4 text-sm text-center text-gray-600">
      Don't have an account?
      <a href="signup.html" class="text-blue-600 hover:underline">Sign up</a>
    </p>
    <form onsubmit="handleLogin(event)">
      <script>
        function handleLogin(event) {
          event.preventDefault();
          window.location.href = "index.html";
        }
      </script>
  </div>
</body>
</html>
