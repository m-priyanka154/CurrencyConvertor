<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('earth.jpeg');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }

    h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    p {
      background-color: rgba(255, 255, 255, 0.2);
      padding: 15px 25px;
      border-radius: 10px;
      text-align: center;
    }

    a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #ffd700;
    }
  </style>
</head>
<body>
  <h2>Welcome to the CURRENCY CONVERTOR</h2>
  <p><a href="login.html">Go to Login page</a></p>
</body>
</html>
